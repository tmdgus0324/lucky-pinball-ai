name: Keep Backend Awake

# Render 무료 티어는 일정 시간 요청이 없으면 슬립 상태가 되어 첫 요청에 30~60초가
# 걸린다 — 면접/시연 시간대(평일 낮)에는 이 지연이 없도록 주기적으로 깨워두고 싶었다.
#
# 자동 스케줄(schedule)은 껐다: 실측해보니 10분 간격으로 설정해도 실제로는 1~2시간에
# 한 번꼴로만 실행돼서(GitHub 공식 문서에도 "부하가 크면 지연되거나 건너뛸 수 있다"고
# 명시됨) 원래 목적을 못 채웠다 — devhelp/33 참고. 대신 cron-job.org(정시성이 더 보장되는
# 전용 스케줄링 서비스)로 옮겼다. 이 워크플로우는 cron-job.org에 문제가 생겼을 때 수동으로
# 한 번 깨우는 비상용으로만 남겨둔다.
#
# 핑 대상(/api/players/reusable)은 로그인 없이 항상 200을 반환하는 공개 엔드포인트라
# 별도 인증 없이 그냥 호출하면 된다.
on:
  workflow_dispatch: # 수동 실행 전용 — Actions 탭에서 "Run workflow"로 필요할 때만 사용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf --max-time 60 https://lucky-pinball-backend.onrender.com/api/players/reusable || true
