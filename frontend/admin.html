<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Lucky Pinball - 관리자</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <header class="top">
    <h1>🛠 관리자 화면</h1>
    <p>참가자 · 게임 · 오류 로그 조회.</p>
  </header>

  <nav class="tabs">
    <a href="index.html">참가자 / 게임 화면</a>
    <a class="active" href="admin.html">관리자 화면</a>
  </nav>

  <!-- 참가자 목록 -->
  <section class="panel">
    <h2>참가자 목록 <span class="badge">GET /api/admin/players</span></h2>
    <p class="desc">각 참가자의 운세 이력(회차별 점수)을 함께 보여줍니다.</p>
    <table class="admin-table">
      <thead>
        <tr><th>ID</th><th>이름</th><th>생년월일</th><th>운세 이력 (날짜 · 점수)</th></tr>
      </thead>
      <tbody id="playersTableBody">
        <tr><td colspan="4">불러오는 중...</td></tr>
      </tbody>
    </table>
  </section>

  <!-- 게임 결과 -->
  <section class="panel">
    <h2>게임 결과 목록 <span class="badge">GET /api/admin/games</span></h2>
    <table class="admin-table">
      <thead>
        <tr><th>게임 ID</th><th>당첨자</th><th>참가 인원</th><th>생성 시각</th></tr>
      </thead>
      <tbody id="gamesTableBody">
        <tr><td colspan="4">불러오는 중...</td></tr>
      </tbody>
    </table>
  </section>

  <!-- 오류 로그 -->
  <section class="panel">
    <h2>오류 로그 <span class="badge">GET /api/admin/logs</span></h2>
    <p class="desc">서버가 재시작되어도 남는 최근 오류 목록입니다 (DB 저장).</p>
    <div class="log-list" id="logList">불러오는 중...</div>
  </section>

</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
