spring:
  datasource:
    url: jdbc:h2:mem:reservation
    username: sa
    password:
  jpa:
    hibernate:
      # 엔티티를 보고 테이블을 만든다. create: 시작할 때마다 새로 만든다(예제용).
      # 운영은 none 또는 validate로 두고, 테이블 변경은 SQL 스크립트나 Flyway로 한다.
      ddl-auto: create
    # 요청 처리가 끝날 때까지 DB 연결을 붙잡아 두는 기능을 끈다(12장).
    open-in-view: false

logging:
  level:
    # Hibernate가 실제로 실행한 SQL
    org.hibernate.SQL: debug
    # ? 자리에 들어간 값
    org.hibernate.orm.jdbc.bind: trace
