<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>예약 목록</title>
</head>
<body>
<h1>예약 목록</h1>

<!-- 리다이렉트 직전에 담은 flash 메시지. 없으면 이 태그 자체가 그려지지 않는다. -->
<p th:if="${message}" th:text="${message}">저장 메시지</p>

<table>
  <tr><th>번호</th><th>예약자</th><th>객실</th><th>숙박</th><th>상태</th></tr>
  <!-- th:each: 목록을 돌며 <tr>을 반복한다(JSP의 <c:forEach>) -->
  <tr th:each="r : ${reservations}">
    <td th:text="${r.id}">1</td>
    <!-- th:text는 <, > 같은 문자를 이스케이프해서 글자 그대로 보여 준다 -->
    <td th:text="${r.guestName}">홍길동</td>
    <td th:text="${r.roomName}">객실</td>
    <td th:text="${r.nights} + '박'">1박</td>
    <td th:text="${r.status == 'CONFIRMED'} ? '확정' : '취소'">확정</td>
  </tr>
</table>

<p th:if="${#lists.isEmpty(reservations)}">예약이 없습니다.</p>

<!-- @{...}는 주소를 만든다. 앱이 /hotel 같은 경로 아래에 배포돼도 앞부분을 알아서 붙인다. -->
<a th:href="@{/reservations/new}">새 예약</a>
</body>
</html>
