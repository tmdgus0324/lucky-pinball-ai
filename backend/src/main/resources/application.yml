server:
  # Render 등 플랫폼은 PORT 환경변수로 포트를 지정한다. 로컬은 기존처럼 8080.
  port: ${PORT:8080}

spring:
  application:
    name: lucky-pinball-backend
  # datasource 3개(url/username/password)는 배포 환경에서 SPRING_DATASOURCE_URL 등
  # 환경변수로 그대로 덮어쓸 수 있다(Spring Boot가 환경변수를 yml보다 우선 적용) — Render에
  # Neon(Postgres) 접속정보를 환경변수로 넣으면, 이 파일을 안 건드리고도 DB가 바뀐다.
  # driver-class-name은 일부러 안 적는다 — URL 접두사(jdbc:h2: / jdbc:postgresql:)만 보고
  # Spring Boot가 알아서 맞는 드라이버를 고른다.
  datasource:
    url: jdbc:h2:file:./data/luckypinball;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # 공개 배포 상태라 기본값은 꺼둔다. 로컬에서 DB 내용을 보고 싶으면
      # H2_CONSOLE_ENABLED=true 환경변수로 그때만 켠다.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

# 모든 로그 줄에 요청 추적 ID를 붙인다([abcd1234]). 요청 밖(서버 시작 등)에서는 [--------].
# 사용자가 화면의 "오류 ID"를 알려주면 이 ID로 그 요청의 로그를 전부 찾을 수 있다(TraceIdFilter).
logging:
  pattern:
    level: "%5p [%X{traceId:--------}]"

# Claude 호출 제한. SDK 기본값(타임아웃 10분, 재시도 2회)이면 Claude가 멈췄을 때 요청 하나가 수십 분을
# 붙잡히므로 줄였다. 평소 응답이 4초 안팎이라 10초 + 재시도 1회(최악 약 20초). 환경변수
# ANTHROPIC_TIMEOUT_SECONDS / ANTHROPIC_MAX_RETRIES로 덮어쓸 수 있다.
# 요청 제한(/api/fortune)이 방문자를 구분할 때 쓰는 헤더. Render 앞단의 Cloudflare가 실제 방문자 IP를 넣어 준다.
# X-Forwarded-For는 클라이언트가 조작할 수 있어서 쓰지 않는다(devhelp/08). 다른 플랫폼이면 그곳이 보장하는 헤더로 바꾼다.
rate-limit:
  client-ip-header: ${CLIENT_IP_HEADER:True-Client-IP}

anthropic:
  timeout-seconds: 10
  max-retries: 1

# AI 호출이 실패하면 오류로 끝내지 않고 임시 점수(FALLBACK)로 진행한다(데모가 API 장애·크레딧 소진으로
# 멈추지 않게). false로 끄면 실패가 그대로 오류 응답(504/503/502)으로 나간다.
fortune:
  fallback-enabled: true

admin:
  username: ${ADMIN_USERNAME:admin}
  # 기본값을 빈 문자열로 둔 이유: 비워두면 로그인이 항상 실패하게 만들어서(AdminAuthController
  # 참고), 배포 환경에 ADMIN_PASSWORD를 깜빡 설정 안 했을 때 누구나 들어가지는 사고를 막는다.
  password: ${ADMIN_PASSWORD:}
